[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signaltrace"
version = "0.1.0"
description = "Local behavioral integrity foundation for Windows"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]
windows = [
    "pywin32>=306; sys_platform == 'win32'",
]
onnx = [
    "onnxruntime>=1.18,<2",
]
genai = [
    "onnxruntime-genai>=0.8,<1",
]
model-download = [
    "huggingface-hub>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
